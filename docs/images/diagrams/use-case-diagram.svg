<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="850" fill="url(#bg-grad)" rx="16" />
  <rect x="10" y="10" width="1180" height="830" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="14" />

  <!-- Title Header -->
  <rect x="40" y="28" width="1120" height="64" fill="#ffffff" rx="10" filter="url(#shadow)" stroke="#e2e8f0" />
  <text x="60" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Use Case Diagram : Platform Pembelajaran SiNC</text>
  <text x="60" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#64748b">Pemetaan Interaksi dan Hak Akses Antara Aktor (Admin, Guru, Siswa) dengan Sistem LMS &amp; Simulator CNC 3D</text>

  <!-- System Boundary Box -->
  <rect x="260" y="110" width="680" height="710" fill="#ffffff" rx="14" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="260" y="110" width="680" height="40" fill="#f8fafc" rx="14" />
  <rect x="260" y="135" width="680" height="15" fill="#f8fafc" />
  <text x="600" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">System Boundary: SiNC Core Platform</text>

  <!-- ACTOR 1: ADMIN (Left Top) -->
  <g transform="translate(50, 160)">
    <rect x="0" y="0" width="170" height="180" fill="#ffffff" rx="12" filter="url(#shadow)" stroke="#94a3b8" stroke-width="1.2" />
    <!-- Actor Icon -->
    <circle cx="85" cy="45" r="18" fill="#e0e7ff" stroke="#4338ca" stroke-width="2" />
    <path d="M 65 85 C 65 67, 105 67, 105 85 Z" fill="#e0e7ff" stroke="#4338ca" stroke-width="2" />
    <text x="85" y="112" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e1b4b" text-anchor="middle">Administrator</text>
    <rect x="20" y="126" width="130" height="22" fill="#ede9fe" rx="11" />
    <text x="85" y="141" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6d28d9" text-anchor="middle">Admin Sekolah</text>
  </g>

  <!-- ACTOR 2: GURU (Left Bottom) -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="170" height="190" fill="#ffffff" rx="12" filter="url(#shadow)" stroke="#94a3b8" stroke-width="1.2" />
    <!-- Actor Icon -->
    <circle cx="85" cy="45" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" />
    <path d="M 65 85 C 65 67, 105 67, 105 85 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" />
    <text x="85" y="112" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Guru Kejuruan</text>
    <rect x="20" y="126" width="130" height="22" fill="#e0f2fe" rx="11" />
    <text x="85" y="141" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369a1" text-anchor="middle">Pengampu Praktik</text>
  </g>

  <!-- ACTOR 3: SISWA (Right Middle) -->
  <g transform="translate(980, 310)">
    <rect x="0" y="0" width="170" height="200" fill="#ffffff" rx="12" filter="url(#shadow)" stroke="#94a3b8" stroke-width="1.2" />
    <!-- Actor Icon -->
    <circle cx="85" cy="48" r="18" fill="#dcfce7" stroke="#15803d" stroke-width="2" />
    <path d="M 65 88 C 65 70, 105 70, 105 88 Z" fill="#dcfce7" stroke="#15803d" stroke-width="2" />
    <text x="85" y="118" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#064e3b" text-anchor="middle">Siswa SMK</text>
    <rect x="18" y="132" width="134" height="22" fill="#f0fdf4" rx="11" />
    <text x="85" y="147" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534" text-anchor="middle">Peserta Didik</text>
  </g>

  <!-- USE CASES (Ovals / Pills) -->
  <!-- Admin Cases -->
  <g transform="translate(310, 175)">
    <rect x="0" y="0" width="260" height="38" rx="19" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3" />
    <text x="130" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#5b21b6" text-anchor="middle">Kelola Data Pengguna (Guru/Siswa)</text>
  </g>
  <g transform="translate(310, 230)">
    <rect x="0" y="0" width="260" height="38" rx="19" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3" />
    <text x="130" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#5b21b6" text-anchor="middle">Reset Kata Sandi &amp; Hak Akses</text>
  </g>
  <g transform="translate(310, 285)">
    <rect x="0" y="0" width="260" height="38" rx="19" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3" />
    <text x="130" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#5b21b6" text-anchor="middle">Pantau Ringkasan Statistik Sekolah</text>
  </g>

  <!-- Guru Cases -->
  <g transform="translate(310, 460)">
    <rect x="0" y="0" width="260" height="38" rx="19" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3" />
    <text x="130" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">Buat Rombel &amp; Bagikan Kode Gabung</text>
  </g>
  <g transform="translate(310, 515)">
    <rect x="0" y="0" width="260" height="38" rx="19" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3" />
    <text x="130" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">Susun Tugas Jobsheet &amp; Upload LKPD PDF</text>
  </g>
  <g transform="translate(310, 570)">
    <rect x="0" y="0" width="260" height="38" rx="19" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3" />
    <text x="130" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">Review G-Code &amp; Rekap Nilai CSV</text>
  </g>
  <g transform="translate(310, 625)">
    <rect x="0" y="0" width="260" height="38" rx="19" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3" />
    <text x="130" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">Konsultasi TeacherBot (AI Asisten KBM)</text>
  </g>

  <!-- Siswa Cases -->
  <g transform="translate(630, 200)">
    <rect x="0" y="0" width="270" height="38" rx="19" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.3" />
    <text x="135" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#14532d" text-anchor="middle">Akses Modul Materi &amp; Lemari Program</text>
  </g>
  <g transform="translate(630, 265)">
    <rect x="0" y="0" width="270" height="38" rx="19" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.3" />
    <text x="135" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#14532d" text-anchor="middle">Tulis &amp; Edit Program G-Code (Panel 2D)</text>
  </g>
  <g transform="translate(630, 330)">
    <rect x="0" y="0" width="270" height="44" rx="22" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)" />
    <text x="135" y="22" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">Eksekusi Simulasi Mesin Bubut 3D</text>
    <text x="135" y="37" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#047857" text-anchor="middle">Rotasi Spindle, Coolant, Pahat &amp; Geram</text>
  </g>
  <g transform="translate(630, 405)">
    <rect x="0" y="0" width="270" height="38" rx="19" fill="#fef2f2" stroke="#ef4444" stroke-width="1.3" />
    <text x="135" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#991b1b" text-anchor="middle">Deteksi Tabrakan &amp; Alarm Anti-Crash</text>
  </g>
  <g transform="translate(630, 470)">
    <rect x="0" y="0" width="270" height="38" rx="19" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.3" />
    <text x="135" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#14532d" text-anchor="middle">Peroleh Skor Toleransi &amp; Kirim Tugas</text>
  </g>
  <g transform="translate(630, 535)">
    <rect x="0" y="0" width="270" height="38" rx="19" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.3" />
    <text x="135" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#14532d" text-anchor="middle">Konsultasi AI CNC-Bot (Mentor Sokratik)</text>
  </g>

  <!-- Shared Case (Both Guru & Siswa / Admin) -->
  <g transform="translate(470, 715)">
    <rect x="0" y="0" width="260" height="38" rx="19" fill="#fefce8" stroke="#eab308" stroke-width="1.3" />
    <text x="130" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#854d0e" text-anchor="middle">Autentikasi (Email/Pass &amp; Google)</text>
  </g>

  <!-- Connectors from Admin to Cases -->
  <path d="M 220 230 L 310 194" stroke="#8b5cf6" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 220 240 L 310 249" stroke="#8b5cf6" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 220 250 L 310 304" stroke="#8b5cf6" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 135 340 L 135 734 L 470 734" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)" />

  <!-- Connectors from Guru to Cases -->
  <path d="M 220 540 L 310 479" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 220 550 L 310 534" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 220 560 L 310 589" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 220 570 L 310 644" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 220 620 L 470 725" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)" />

  <!-- Connectors from Siswa to Cases -->
  <path d="M 980 370 L 900 219" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 980 380 L 900 284" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 980 400 L 900 352" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
  <path d="M 980 420 L 900 424" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 980 435 L 900 489" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 980 450 L 900 554" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 1065 510 L 1065 734 L 730 734" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)" />

</svg>
